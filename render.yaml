services:
  # ── Frontend: Svelte static site ─────────────────────────────────────────
  # Hosted for free on Render.
  - type: web
    name: street-hunt-app
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # Set this in the Render Dashboard to your local backend's public URL (e.g. ngrok)
